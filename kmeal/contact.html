<!doctype html>
<html lang="ja">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- index.htmlと同じhead -->
    <title>お問い合わせ | MIRYONG KITCHEN</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- headerはindex.htmlからコピー、ただしhref="#about"などを"./index.html#about"に変更 -->

    <main class="main">
      <section class="contact-page section">
        <div class="inner">
            <a href="./index.html" class="contact-page__close">✕ 閉じる</a>
          <hgroup class="section__heading-group">
            <p class="section__eyebrow">Contact</p>
            <h1 class="section__title">お問い合わせ</h1>
          </hgroup>
          <p class="section__lead">
            お気軽にご連絡ください。<br />
            3営業日以内にご返信いたします。
          </p>

          <form class="contact-form" novalidate>

            <div class="contact-form__group">
              <label class="contact-form__label" for="name">
                お名前 <span class="contact-form__required">必須</span>
              </label>
              <input class="contact-form__input" type="text" id="name" name="name" placeholder="例：山田 太郎" required />
            </div>

            <div class="contact-form__group">
              <label class="contact-form__label" for="email">
                メールアドレス <span class="contact-form__required">必須</span>
              </label>
              <input class="contact-form__input" type="email" id="email" name="email" placeholder="例：taro@example.com" required />
            </div>

            <div class="contact-form__group">
              <label class="contact-form__label" for="tel">
                電話番号 <span class="contact-form__optional">任意</span>
              </label>
              <input class="contact-form__input" type="tel" id="tel" name="tel" placeholder="例：090-0000-0000" />
            </div>

            <div class="contact-form__group">
              <label class="contact-form__label" for="type">
                お問い合わせ種別 <span class="contact-form__required">必須</span>
              </label>
              <select class="contact-form__select" id="type" name="type" required>
                <option value="">選択してください</option>
                <option value="order">注文について</option>
                <option value="delivery">配送について</option>
                <option value="cancel">キャンセル・返品について</option>
                <option value="other">その他</option>
              </select>
            </div>

            <div class="contact-form__group">
              <label class="contact-form__label" for="message">
                お問い合わせ内容 <span class="contact-form__required">必須</span>
              </label>
              <textarea class="contact-form__textarea" id="message" name="message" rows="6" placeholder="ご質問・ご要望をご記入ください（500文字以内）" maxlength="500" required></textarea>
              <p class="contact-form__count"><span id="js-char-count">0</span> / 500文字</p>
            </div>

            <div class="contact-form__submit">
              <button type="submit" class="button button--primary">送信する 📩</button>
            </div>

          </form>
        </div>
      </section>
    </main>

    <script src="./script.js" defer></script>

    <!-- footerはindex.htmlからコピー -->
  </body>
</html>
